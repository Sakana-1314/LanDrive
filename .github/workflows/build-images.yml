name: 构建并推送镜像

# 构建 web / server 两个镜像并推送到 GitHub Container Registry（ghcr.io）。
#
# 固定 tag（不随版本变化，部署脚本可长期引用）：
#   ghcr.io/sakana-1314/lan-drive:web
#   ghcr.io/sakana-1314/lan-drive:server
# 同时打上带时间戳的 tag（如 web-20260923-031500）便于回溯与回滚。
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "是否额外推送带时间戳的相对 tag"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr 的镜像路径必须全小写：仓库owner 保留了原始大小写（Sakana-1314），
  # 且仓库名现为 LanDrive，两者都不能直接用于镜像路径，
  # 因此这里显式写死小写，避免 "repository name must be lowercase"。
  IMAGE: sakana-1314/lan-drive

jobs:
  # ---------- 变更检测：只构建改动过的组件 ----------
  detect:
    name: 变更检测
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 判断变更目录
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/build-images.yml'
            web:
              - 'web/**'
              - '.github/workflows/build-images.yml'

  # ---------- server 镜像（内网 API） ----------
  build-server:
    name: 构建 server 镜像
    needs: detect
    # 手动触发时无视路径过滤，两个镜像都构建。
    if: needs.detect.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 校验镜像名全小写
        # ghcr 拒绝含大写字母的仓库名，提前给出可读的报错。
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE }}"
          if [ "$ref" != "$(echo "$ref" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::镜像地址含大写字母，ghcr 不接受：$ref"
            exit 1
          fi
          echo "镜像地址：$ref"

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成时间戳 tag
        id: stamp
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送 server 镜像（固定 tag）
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          # 内网服务器多为 amd64；需要 arm64 时在此追加 linux/arm64。
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:server
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:server-${{ steps.stamp.outputs.value }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: false
          sbom: false

      - name: 输出镜像信息
        run: |
          echo "### server 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:server" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:server-${{ steps.stamp.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------- web 镜像（公网前端） ----------
  build-web:
    name: 构建 web 镜像
    needs: detect
    if: needs.detect.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 校验镜像名全小写
        # ghcr 拒绝含大写字母的仓库名，提前给出可读的报错。
        run: |
          ref="${{ env.REGISTRY }}/${{ env.IMAGE }}"
          if [ "$ref" != "$(echo "$ref" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::镜像地址含大写字母，ghcr 不接受：$ref"
            exit 1
          fi
          echo "镜像地址：$ref"

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成时间戳 tag
        id: stamp
        run: echo "value=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      # 公开镜像不得含真实内网域名：镜像推到公开 ghcr 后任何人都能解包读取，
      # 曾因构建期 --build-arg HOST=<内网域名> 把域名烘进前端产物。
      #
      # 只扫**会进入产物**的构建期输入（.env*、vite 配置、源码里的默认值），
      # 不扫文档与测试：测试里用 192.168.x 造跨域样例是正常的，扫它们只会误报。
      - name: 校验构建期输入不含真实内网域名
        working-directory: web
        run: sh scripts/check-no-internal-host.sh

      - name: 构建并推送 web 镜像（固定 tag）
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          # ★ 故意不传 HOST，保持为空：前端走**同源 /api**，与网页端自己的域名一致。
          #   - 浏览器只访问一个域名，不跨域、不需要 CORS；
          #   - 镜像与部署环境解耦，换地址只需改运行时环境变量；
          #   - 镜像推送到公开的 ghcr，若在构建期烘焙后端域名，
          #     任何人都能从镜像里读出来（曾因此把内网域名泄进公开镜像）。
          #   部署时二选一：
          #     LANDRIVE_API_PROXY=api:8080           同源反代（推荐）
          #     LANDRIVE_API_BASE_URL=https://.../api  跨域直连
          #   自建镜像确实需要固化地址时，用 --build-arg HOST=<域名>（仅 origin）。
          build-args: |
            VITE_API_PROBE_TIMEOUT=6000
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:web
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:web-${{ steps.stamp.outputs.value }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false
          sbom: false

      - name: 输出镜像信息
        run: |
          echo "### web 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:web" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE }}:web-${{ steps.stamp.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------- 汇总 ----------
  build-summary:
    name: 镜像构建完成
    needs: [build-server, build-web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 校验构建结果
        run: |
          echo "server：${{ needs.build-server.result }}"
          echo "web：${{ needs.build-web.result }}"
          for r in "${{ needs.build-server.result }}" "${{ needs.build-web.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::镜像构建未成功（$r）"; exit 1 ;;
            esac
          done
          echo "✅ 镜像构建全部完成"
