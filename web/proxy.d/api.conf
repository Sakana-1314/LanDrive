# /api 的默认处理：**不反代**，返回 JSON 404。
#
# 容器启动时，40-lan-drive-config.sh 会在设置了 LANDRIVE_API_PROXY 的情况下
# 用反代版本覆盖本文件。
#
# 为什么未反代时要显式返回 404，而不是让它落到 SPA 回退：
# 那样 /api/health 会返回 200 + HTML 首页，前端探测会误判为"内网已连通"，
# 用户随后登录却失败，看到的是莫名其妙的错误而不是
# 「无法在此网络下使用，请更换网络再试！」。
location /api/ {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 404 '{"error":"接口未通过本容器反代：请设置 LANDRIVE_API_PROXY，或改用跨域直连的接口地址"}';
}
