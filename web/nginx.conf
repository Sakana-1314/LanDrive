# 局域网文件助手前端 —— nginx 站点配置
#
# 两种部署形态共用本文件，由容器启动脚本按环境变量切换：
#
#   A) 同源反代：浏览器请求本域名下的 /api，nginx 转发到后端容器
#      （LANDRIVE_API_PROXY=api:8080）。
#      → 不跨域、无需 CORS，后端地址不外泄，浏览器只访问一个域名。
#
#   B) 跨域直连（默认）：/api 不反代，前端通过 /config.js 注入的绝对地址
#      直接访问内网 API（需要后端配置 LANDRIVE_CORS_ALLOW）。
#
# 整个 `location /api/` 都由 /etc/nginx/proxy.d/api.conf 提供（启动脚本生成）：
# nginx 不允许在同一 location 里既 include 进 proxy_pass 又写 return，
# 因此把该 location 整体外置，默认文件是「不反代」版本。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传大文件。同源反代时上传流量会经过本容器，必须放宽（nginx 默认只有 1m）。
    client_max_body_size 1024m;

    # 中转大文件时不把整个请求体缓冲到磁盘/内存，避免中转数据打满磁盘。
    proxy_request_buffering off;
    proxy_buffering off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # /api 的处理方式：由启动脚本写入（反代 或 返回 JSON 404），见文件头说明。
    include /etc/nginx/proxy.d/api.conf;

    # 运行时配置：绝不缓存，保证改环境变量重启后立即生效。
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # 带内容哈希的静态资源可长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/files、/admin/users 等前端路由直接刷新也要能打开。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
