# 局域网文件助手前端 —— nginx 站点配置
#
# 前端在前端容器内是纯静态站点，不代理 /api（API 在内网，由浏览器跨域直连，
# 地址通过 /config.js 注入）。这样前端可以放到任何静态托管上。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传大文件（若前端与 API 同机部署并被同域访问时才有意义）
    client_max_body_size 1024m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # 运行时配置：绝不缓存，保证改环境变量重启后立即生效。
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    # 带内容哈希的静态资源可长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/files、/admin/users 等前端路由直接刷新也要能打开。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
