<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      站点图标：png 优先级高于 .ico，因此这里的声明才是现代浏览器实际用的那张。
      .ico 仅作为静态托管/老环境的兜底，两者图形一致。
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>局域网文件助手</title>
    <!--
      运行时配置：容器部署时由 nginx 的 docker-entrypoint.d 脚本生成，
      用于在不重新构建镜像的前提下切换内网 API 地址。
      静态托管部署时该文件不存在也无妨（onerror 静默忽略，回退构建期变量）。
    -->
    <script src="/config.js" onerror="void 0"></script>
    <!--
      首屏外观预置：在样式生效前就按已保存档位（或系统偏好）写好 data-theme，
      否则深色用户会先看到一帧白底再翻黑。此处逻辑与 utils/themeState.ts 保持一致，
      只是提前到主包加载之前执行。
    -->
    <script>
      ;(function () {
        try {
          var mode = localStorage.getItem('lanfs-theme-mode') || 'auto'
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#161a21' : '#ffffff')
        } catch (e) {
          /* localStorage 不可用（隐私模式）时按浅色渲染即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
