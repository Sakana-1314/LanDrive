# 局域网文件助手 —— 一体化部署（内网单机：MySQL + API + 前端）
#
# 适用场景：API 与前端部署在**同一台内网服务器**上（前端同机 nginx，浏览器同源访问）。
# 公网前端 + 内网 API 的标准拓扑请用 docker-compose.yml（那个文件只含 MySQL + API）。
#
#   docker compose -f docker-compose.full.yml up -d
#   浏览器访问 http://<服务器内网IP>/
#
# 注意：这种方式前端页面只能在内网打开（因为 nginx 在内网）。
#       若要让员工在外网也能打开页面（仅接口不可达时提示更换网络），
#       请把 web 镜像单独部署到公网。

services:
  mysql:
    image: mysql:8.0
    container_name: lanfs-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: "change-me-root-password"
      MYSQL_DATABASE: "lanfs"
      MYSQL_USER: "lanfs"
      MYSQL_PASSWORD: "change-me-db-password"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchange-me-root-password"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: ghcr.io/sakana-1314/lan-drive:server
    container_name: lanfs-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LANDRIVE_LISTEN: ":8080"
      LANDRIVE_MYSQL_DSN: "lanfs:change-me-db-password@tcp(mysql:3306)/lanfs"
      LANDRIVE_AUTO_CREATE_DB: "true"
      LANDRIVE_JWT_SECRET: "change-me-to-a-random-32-plus-char-secret"
      LANDRIVE_DATA_DIR: "/data"
      LANDRIVE_ADMIN_EMPLOYEE_NO: "admin"
      LANDRIVE_ADMIN_PASSWORD: "change-me-admin-password"
      LANDRIVE_ADMIN_NAME: "系统管理员"
      # 同机部署：浏览器访问的是前端 nginx，跨域来源即本站点地址。
      # 若通过域名访问，改成实际域名，如 https://files.your-company.com
      LANDRIVE_CORS_ALLOW: "http://localhost"
      TZ: "Asia/Shanghai"
    volumes:
      - file-data:/data
    expose:
      - "8080"

  web:
    image: ghcr.io/sakana-1314/lan-drive:web
    container_name: lanfs-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # 前端同机部署：浏览器直连 API 的内网地址。
      # 若通过域名/反代访问，改成对外可达的地址，例如 https://api.your-company.com/api
      LANDRIVE_API_BASE_URL: "http://localhost:8080/api"
    ports:
      - "80:80"

volumes:
  mysql-data:
    driver: local
  file-data:
    driver: local
