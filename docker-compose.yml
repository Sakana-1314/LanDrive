# 局域网文件助手 —— 部署拓扑
#
#   公网用户 ──> 前端静态站点（web/ 构建产物，部署在公网）
#                     │  跨域 HTTPS 请求 /api/**
#                     ▼
#              内网 API 服务（本 compose 中的 app，仅内网可达）
#                     │
#                     ▼
#                  MySQL
#
# 镜像：ghcr.io/sakana-1314/lan-drive:server（由 .github/workflows/build-images.yml 自动构建推送）
#      需要从源码构建时，把 app 下的 build: 注释打开、image: 注释掉。
#
# 关键配置：
#   1. LANDRIVE_CORS_ALLOW 必须填**前端所在域名**（如 https://files.your-company.com），
#      否则浏览器会拦截跨域请求，用户会看到「无法在此网络下使用，请更换网络再试！」。
#   2. app 的 8080 端口**不要暴露到公网**，只在内网可达；
#      公网侧通过 VPN 或内网网关访问。用防火墙/安全组限制来源网段。
#   3. 前端部署时用 LANDRIVE_API_BASE_URL（或构建期 HOST）指向内网 API 地址。

services:
  mysql:
    image: mysql:8.0
    container_name: lanfs-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: "change-me-root-password"
      MYSQL_DATABASE: "lanfs"
      MYSQL_USER: "lanfs"
      MYSQL_PASSWORD: "change-me-db-password"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pchange-me-root-password"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # 数据库仅内网使用，不对外暴露端口。
    expose:
      - "3306"

  app:
    # 默认使用 CI 构建好的固定 tag 镜像；改为注释 image + 取消 build 注释即可从源码构建。
    image: ghcr.io/sakana-1314/lan-drive:server
    # build:
    #   context: ./server
    #   dockerfile: Dockerfile
    container_name: lanfs-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      LANDRIVE_LISTEN: ":8080"
      LANDRIVE_MYSQL_DSN: "lanfs:change-me-db-password@tcp(mysql:3306)/lanfs"
      LANDRIVE_AUTO_CREATE_DB: "true"
      # 必填：至少 32 字符，建议用 `openssl rand -hex 32` 生成。
      LANDRIVE_JWT_SECRET: "change-me-to-a-random-32-plus-char-secret"
      LANDRIVE_DATA_DIR: "/data"
      # 首次启动（users 表为空）时创建管理员；之后修改此处不影响已有账号。
      LANDRIVE_ADMIN_EMPLOYEE_NO: "admin"
      LANDRIVE_ADMIN_PASSWORD: "change-me-admin-password"
      LANDRIVE_ADMIN_NAME: "系统管理员"
      # ★ 必改：前端（公网）域名白名单，逗号分隔；这是跨域访问能否成功的关键。
      LANDRIVE_CORS_ALLOW: "https://files.your-company.com"
      # 若前面还有 Nginx 等反向代理，置 true 以正确记录客户端 IP。
      LANDRIVE_TRUST_PROXY: "false"
      LANDRIVE_LOG_KEEP_DAYS: "90"
      TZ: "Asia/Shanghai"
    volumes:
      - file-data:/data
    ports:
      # 只绑定到内网网卡（示例 192.168.1.100），避免暴露到公网。
      # 若服务器有多个网卡，把左侧改成具体内网 IP，例如 "192.168.1.100:8080:8080"。
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql-data:
    driver: local
  file-data:
    driver: local
