# 局域网文件助手 —— 部署编排（接入 1Panel 的 1panel-network）
#
# 网络模型：
#   本编排不创建网络，所有服务加入 1Panel 已有的 1panel-network，
#   与 1Panel 里安装的其它应用（MySQL、反向代理等）直接互通。
#   使用前请确认该网络已存在：docker network ls | grep 1panel-network
#
# 数据库：
#   MySQL **不在本编排中部署**，请用 1Panel 应用商店安装 MySQL，或指向已有的数据库实例，
#   然后通过 .env 的 LANDRIVE_MYSQL_DSN 填写连接串（见 .env.example）。
#
# 组件：
#   api —— 服务端接口（必需）
#   web —— 网页端（如需外网访问页面则保留；只在内网用可整段删除）
#
# 启动：
#   cp .env.example .env    # 按注释填写，必填项没填会直接报错
#   docker compose up -d
#
# 反向代理：
#   在 1Panel 的「网站」里把域名反代到 http://<服务器IP>:${WEB_PORT}（网页端）
#   与 http://<服务器IP>:${API_PORT}（接口），并把实际访问地址填入 LANDRIVE_CORS_ALLOW。

name: lan-drive

services:
  # ---------- 服务端接口 ----------
  api:
    image: ghcr.io/sakana-1314/lan-drive:server
    # 需要从源码构建时，注释掉 image，取消下面 build 的注释：
    # build:
    #   context: ./server
    #   dockerfile: Dockerfile
    container_name: lan-drive-api
    restart: unless-stopped
    environment:
      LANDRIVE_LISTEN: ":8080"
      # ★ 必填：指向 1Panel 中 MySQL 的连接串
      LANDRIVE_MYSQL_DSN: ${LANDRIVE_MYSQL_DSN:?请在 .env 中填写 MySQL 连接串，例如 lanfs:密码@tcp(mysql:3306)/lanfs}
      LANDRIVE_AUTO_CREATE_DB: "true"
      # ★ 必填：登录凭据签名密钥，至少 32 位（openssl rand -hex 32）
      LANDRIVE_JWT_SECRET: ${LANDRIVE_JWT_SECRET:?请在 .env 中填写至少 32 位的随机密钥}
      # 首次启动（账号表为空）时创建管理员；之后修改此处不影响已有账号
      LANDRIVE_ADMIN_EMPLOYEE_NO: ${LANDRIVE_ADMIN_EMPLOYEE_NO:-admin}
      LANDRIVE_ADMIN_PASSWORD: ${LANDRIVE_ADMIN_PASSWORD:?请在 .env 中填写管理员初始密码}
      LANDRIVE_ADMIN_NAME: ${LANDRIVE_ADMIN_NAME:-系统管理员}
      # 文件存储根目录（容器内），对应下面的 file-data 卷
      LANDRIVE_DATA_DIR: "/data"
      # ★ 必填：允许访问接口的网页地址，即用户浏览器里打开的地址。
      #   填错会导致跨域被拦截，用户看到「无法在此网络下使用，请更换网络再试！」
      LANDRIVE_CORS_ALLOW: ${LANDRIVE_CORS_ALLOW:?请在 .env 中填写网页端访问地址，例如 https://files.example.com}
      # 流量经过 1Panel 反向代理时为 true，以便正确记录客户端 IP
      LANDRIVE_TRUST_PROXY: ${LANDRIVE_TRUST_PROXY:-true}
      LANDRIVE_LOG_KEEP_DAYS: ${LANDRIVE_LOG_KEEP_DAYS:-90}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - file-data:/data
    ports:
      # 供 1Panel 反向代理访问；也可只绑定内网地址，如 "192.168.1.100:8080:8080"
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - 1panel-network

  # ---------- 网页端 ----------
  # 若网页端要单独部署到公网（接口仍留内网），删掉这一段，
  # 改为在公网服务器上单独运行 web 镜像并设置 LANDRIVE_API_BASE_URL。
  web:
    image: ghcr.io/sakana-1314/lan-drive:web
    container_name: lan-drive-web
    restart: unless-stopped
    depends_on:
      # 接口地址由浏览器直接请求，网页端本身不依赖接口健康状态；
      # 这里只保证启动顺序，避免同时重启时页面先于接口就绪。
      - api
    environment:
      # 浏览器访问接口的地址（要带 /api，且必须是浏览器能访问到的地址）。
      # 留空则使用镜像构建时注入的地址。
      LANDRIVE_API_BASE_URL: ${LANDRIVE_API_BASE_URL:-}
      LANDRIVE_API_PROBE_TIMEOUT: ${LANDRIVE_API_PROBE_TIMEOUT:-6000}
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/config.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - 1panel-network

volumes:
  # 上传的文件。数据库里只存相对路径，因此该卷必须与数据库一起备份。
  file-data:
    driver: local

networks:
  # 由 1Panel 创建，本编排只接入、不创建。
  1panel-network:
    external: true
